# One release of the editor extension, built here from the tag:
#   1. build   the VS Code extension (.vsix) and the JetBrains plugin (the build antitheft installs, and the
#              JetBrains Marketplace build with no internal IDE API), tests included, SHA256SUMS
#   2. release a GitHub release for the tag with those files
#   3. vscode  the .vsix to the Visual Studio Marketplace with Trusted Publishing: the Marketplace trusts this
#              workflow file (publish.yml) in this repository, so no access token is stored anywhere
# Pushing a tag v<version> starts it (antitheft's release pipeline does, then publishes the same files to Open VSX
# and JetBrains Marketplace). It can be run again by hand for an existing tag from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.1.41 (must match vscode/package.json)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # The IDE whose libraries the JetBrains plugin compiles against (its runtime is Java 25; the guard also needs a 21)
  IDEA_URL: https://download.jetbrains.com/idea/idea-2026.2.4.tar.gz
  IDEA_SHA256: cc6b29ddb82c7dcc656d5c728cefb2c917ac767eb4b8368f1208732846fbb5bd
  VSCE: "@vscode/vsce@4.1.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: The tag is the version in vscode/package.json
        id: version
        run: |
          version=$(sed -n 's/^  "version": "\([^"]*\)".*/\1/p' vscode/package.json | head -n1)
          [ "$TAG" = "v$version" ] || { echo "tag $TAG does not match vscode/package.json version $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: "24"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3   # v4.9.1
        id: jdk21
        with:
          distribution: temurin
          java-version: "21"

      - name: VS Code extension
        working-directory: vscode
        run: |
          npm ci
          npm test
          npm run build
          cp ../LICENSE.md .
          npx --yes "$VSCE" package --no-dependencies --out antitheft.vsix
          rm LICENSE.md

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: ~/idea.tar.gz
          key: idea-${{ env.IDEA_SHA256 }}

      - name: IntelliJ IDEA (libraries and runtime for the JetBrains build)
        run: |
          [ -f ~/idea.tar.gz ] || curl -fsSL --retry 3 -o ~/idea.tar.gz "$IDEA_URL"
          echo "$IDEA_SHA256  $HOME/idea.tar.gz" | sha256sum -c -
          mkdir -p ~/idea && tar -xzf ~/idea.tar.gz -C ~/idea --strip-components=1
          echo "IDE_HOME=$HOME/idea" >> "$GITHUB_ENV"

      - name: JetBrains plugin (antitheft's build and the Marketplace build) and the guard's test
        working-directory: jetbrains
        env:
          JDK21: ${{ steps.jdk21.outputs.path }}
        # The guard's test first: it builds its own agent into build/ (build.sh --agent wipes that folder), so the
        # two release builds after it leave build/antitheft.zip and build-store/antitheft.zip in place.
        run: |
          JDK25="$IDE_HOME/jbr" sh test/agent.sh
          sh build.sh
          sh build.sh --store

      - name: Release files
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          mkdir out-release
          cp vscode/antitheft.vsix "out-release/antitheft-$V.vsix"
          cp jetbrains/build/antitheft.zip "out-release/antitheft-jetbrains-$V.zip"
          cp jetbrains/build-store/antitheft.zip "out-release/antitheft-jetbrains-marketplace-$V.zip"
          (cd out-release && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: release
          path: out-release/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: release
          path: out-release
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists already; its files are left as they are"
            exit 0
          fi
          {
            echo "antitheft for code editors, version $V."
            echo
            echo "| File | For |"
            echo "| --- | --- |"
            echo "| \`antitheft-$V.vsix\` | VS Code, Cursor, VSCodium, Windsurf, Antigravity IDE: Extensions > ... > Install from VSIX |"
            echo "| \`antitheft-jetbrains-$V.zip\` | IntelliJ IDEA, PyCharm, Android Studio and other JetBrains IDEs: Settings > Plugins > Install Plugin from Disk |"
            echo "| \`antitheft-jetbrains-marketplace-$V.zip\` | the copy published on JetBrains Marketplace |"
            echo
            echo "It works with the antitheft app (https://antitheft.pro), which also installs it for you from Settings > Editors."
            echo "Check a download against \`SHA256SUMS\` (\`sha256sum -c SHA256SUMS\`)."
          } > notes.md
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "antitheft extension $V" --notes-file notes.md --verify-tag out-release/*

  vscode:
    needs: [build, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write   # the OIDC token the Marketplace exchanges for a 15-minute publishing credential
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: release
          path: out-release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: "24"
      - name: Visual Studio Marketplace
        env:
          V: ${{ needs.build.outputs.version }}
        run: npx --yes "$VSCE" publish --oidc --packagePath "out-release/antitheft-$V.vsix"
