# Publishes the VS Code extension to the Visual Studio Marketplace with Trusted Publishing: the Marketplace trusts
# this workflow in this repository, so no access token is stored anywhere. Started by antitheft's release pipeline
# (`gh workflow run publish.yml -f tag=v<version>`) after it pushes the release tag; it can also be run by hand from
# the Actions tab. Open VSX and JetBrains Marketplace are published by the pipeline itself.
name: Publish to the Visual Studio Marketplace

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.41 (must match vscode/package.json)"
        required: true

permissions:
  contents: read

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # the OIDC token the Marketplace exchanges for a 15-minute publishing credential
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: "24"

      - name: The tag is the version in package.json
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p 'require("./package.json").version')
          [ "$TAG" = "v$version" ] || { echo "tag $TAG does not match package.json version $version" >&2; exit 1; }

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Package
        run: |
          cp ../LICENSE.md .
          npx --yes @vscode/vsce@4.1.0 package --no-dependencies --out antitheft.vsix
          rm LICENSE.md
          sha256sum antitheft.vsix

      - name: Publish
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath antitheft.vsix
